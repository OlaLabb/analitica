<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Predicción y probabilidades reales de BALOTO y REVANCHA" />
    <title>Analítica de Sorteos</title>
    <script>
      try {
        var t = localStorage.getItem("theme");
        // Tema claro por defecto; el oscuro solo si el usuario lo eligió.
        if (t === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
