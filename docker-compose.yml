services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sorteo
      POSTGRES_PASSWORD: sorteo
      POSTGRES_DB: sorteo
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sorteo"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sorteo:sorteo@db:5432/sorteo
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    depends_on: [backend]
    ports: ["5173:80"]

volumes:
  pgdata:
